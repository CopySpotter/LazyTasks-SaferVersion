name: Import verified v0.0.0 baseline

# One-time bootstrap: this workflow imports the source and the offline-build
# vendor jar from the existing, checksum-pinned v0.0.0 release asset.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-baseline.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'CopySpotter/LazyTasks-SaferVersion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and authenticate original baseline
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/CopySpotter/LazyTasks-SaferVersion/releases/download/v0.0.0/BusyTasks_Safe_Mint_v1_1.zip' \
            -o "$RUNNER_TEMP/baseline.zip"
          echo '1af7087cb615e06d5da722828984e6f5b8aeeba3c7f767f5a2bdd3c4987ebeb4  '"$RUNNER_TEMP/baseline.zip" | sha256sum -c -
      - name: Import source, offline dependency, tests, license, and documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lazytasks-import"
          unzip -q "$RUNNER_TEMP/baseline.zip" -d "$RUNNER_TEMP/lazytasks-import"
          package="$RUNNER_TEMP/lazytasks-import/BusyTasks_Safe_Mint_v1_1"
          test -f "$package/src/BusyTasks/BusyTasks.java"
          test -f "$package/COPYING"
          test -f "$package/vendor/BusyTasks-u2.9.jar"
          test -f "$package/build.sh"
          cp -a "$package/src" "$package/tests" "$package/vendor" ./
          cp -a "$package/CHANGELOG.md" "$package/COPYING" \
            "$package/INSTALLATION_KURZ.txt" "$package/TESTPROTOKOLL.md" \
            "$package/build.sh" "$package/start.sh" ./
          mkdir -p docs
          cp "$package/docs/VORSCHAU_1366x768.png" docs/
          chmod +x build.sh start.sh
          # Deliberately exclude dist/*.jar: the prebuilt binary lives in the release.
      - name: Verify and commit baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COPYING CHANGELOG.md INSTALLATION_KURZ.txt TESTPROTOKOLL.md \
            build.sh start.sh src tests vendor docs/VORSCHAU_1366x768.png
          if git diff --cached --quiet; then
            echo 'Baseline already imported.'
            exit 0
          fi
          git commit -m 'build: import verified v0.0.0 sources and offline dependency [skip ci]'
          git push
