name: Build and tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'vendor/**'
      - 'build.sh'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and run unit tests (offline)
        run: bash build.sh test
      - name: Verify generated JAR
        run: |
          test -s dist/BusyTasks-Safe-1.1.jar
          unzip -t dist/BusyTasks-Safe-1.1.jar | tail -1
